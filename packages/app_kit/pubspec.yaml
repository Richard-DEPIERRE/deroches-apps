name: app_kit
description: The DeRoches Apps app kit (ADR 0001). Every studio app is built on it.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # For lib/testing.dart, the fakes and helpers (the data-upgrade test among
  # them) that app tests import; never reaches a release build.
  flutter_test:
    sdk: flutter
  sentry_flutter: ^10.2.0
  package_info_plus: ^10.2.2
  file_picker: ^13.3.2
  posthog_flutter: ^5.58.4
  purchases_flutter: ^11.0.0
  # Opens the legal links (the paywall's terms and privacy, then settings).
  url_launcher: ^6.3.2
  in_app_review: ^2.0.12

flutter:
  generate: true
