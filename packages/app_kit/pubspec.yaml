name: app_kit
description: The DeRoches Apps app kit (ADR 0001). Every studio app is built on it.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # For lib/testing.dart only (the data-upgrade test helper); apps import it
  # from their tests, so it never reaches a release build.
  flutter_test:
    sdk: flutter
