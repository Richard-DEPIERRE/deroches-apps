name: app_kit
description: The DeRoches Apps app kit (ADR 0001). Every studio app is built on it.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # For lib/testing.dart, the fakes and helpers app tests import.
  flutter_test:
    sdk: flutter

flutter:
  generate: true
