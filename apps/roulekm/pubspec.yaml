name: roulekm
description: Roulekm, a private mileage log with the official rates (DAPP-132). Built on the app kit (ADR 0001).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  app_kit:
    path: ../../packages/app_kit
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Parses the Android backup rules in test/backup_rules_test.dart.
  xml: ^6.6.1

flutter:
  uses-material-design: true
  generate: true
