# CI for deroches-apps (DAPP-7). Self-hosted only: GitHub-hosted minutes are off
# on this account, so never `ubuntu-latest` or `macos-latest`. The runner is the
# studio Mac, registered for this repo with the label `deroches-apps` (the
# needs-richard child of DAPP-7). It is shared: one job at a time, short timeouts,
# no secrets in any job.
#
# Still to come (the follow-up of DAPP-7): the iOS and Android builds of
# apps/kit_example and the screenshots artifact.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (flutter analyze)
    runs-on: [self-hosted, macOS, ARM64, deroches-apps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - run: flutter --version
      - run: tool/check.sh analyze

  test:
    name: Tests (flutter test, data-upgrade tests included)
    runs-on: [self-hosted, macOS, ARM64, deroches-apps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - run: tool/check.sh test

  site:
    name: Site build (lint, tests, every site)
    runs-on: [self-hosted, macOS, ARM64, deroches-apps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: tool/check-sites.sh
